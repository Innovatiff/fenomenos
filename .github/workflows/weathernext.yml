# WeatherNext (Google DeepMind) vía BigQuery. Necesita dos secrets del
# repositorio: GCP_SA_KEY (clave JSON de la cuenta de servicio) y
# GCP_PROJECT (ID del proyecto). Sin ellos, el sondeo sale limpio
# explicando qué falta.
name: WeatherNext

on:
  schedule:
    - cron: "20 3,9,15,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weathernext
  cancel-in-progress: true

jobs:
  datos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Código
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias
        run: pip install google-cloud-bigquery

      - name: Credenciales
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$GCP_SA_KEY" ]; then
            printf '%s' "$GCP_SA_KEY" > /tmp/gcp-key.json
            echo "clave escrita"
          else
            echo "sin GCP_SA_KEY todavía"
          fi

      - name: WeatherNext
        env:
          GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: python scripts/build_weathernext.py

      - name: Publicar datos
        run: |
          git config user.name "fenomenos-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/modelos 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sin cambios"
            exit 0
          fi
          git commit -m "data: weathernext $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase && sleep 5
          done
          git push
